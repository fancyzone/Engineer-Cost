name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore 施工定额.sln

      - name: Build
        run: dotnet build 施工定额.sln -c Release --no-restore

      - name: Test
        run: dotnet test 施工定额.Tests/施工定额.Tests.csproj -c Release --no-build --verbosity normal
